<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan's World</title>
  <meta name="description" content="Games made by Alan, for Alan and his friends.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 32px;
      font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
      color: #fff;
      text-align: center;
      background: #1b1447 radial-gradient(circle at 50% 0%, #4b2fa8 0%, #1b1447 60%) no-repeat;
    }

    h1 {
      margin: 0 0 40px;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      letter-spacing: 1px;
      color: #ffd93d;
      text-shadow: 0 4px 0 #e0662b, 0 8px 18px rgba(0, 0, 0, .35);
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      width: 100%;
      max-width: 1260px;
    }

    .game-col {
      flex: 1 1 240px;
      max-width: 290px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .game {
      display: block;
      padding: 24px 20px 22px;
      border-radius: 28px;
      color: #fff;
      text-decoration: none;
      border: 4px solid rgba(255, 255, 255, .85);
      box-shadow: 0 8px 0 rgba(0, 0, 0, .3);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .game:hover,
    .game:focus-visible {
      transform: translateY(-6px) rotate(-1.5deg);
      box-shadow: 0 14px 0 rgba(0, 0, 0, .3);
      outline: none;
    }

    .game:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, .3);
    }

    .tower { background: linear-gradient(160deg, #38b6ff, #2a62d8); }
    .alien { background: linear-gradient(160deg, #7be04f, #159a6c); }
    .junk { background: linear-gradient(160deg, #b57bea, #5b2d8f); }
    .ravens { background: linear-gradient(160deg, #ff8a5c, #8c1f3a); }

    .game svg {
      display: block;
      width: 140px;
      height: 140px;
      margin: 0 auto 12px;
    }

    .game h2 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .25);
    }

    .play {
      display: inline-block;
      padding: 8px 22px;
      border-radius: 999px;
      background: #fff;
      color: #1b1447;
      font-weight: bold;
    }

    .ranking {
      padding: 16px 18px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .08);
      border: 2px solid rgba(255, 255, 255, .18);
      text-align: left;
    }

    .ranking h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: #ffd93d;
      text-align: center;
    }

    .ranking ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .ranking li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 5px 0;
      font-size: .95rem;
    }

    .ranking li + li { border-top: 1px solid rgba(255, 255, 255, .12); }

    .ranking .place { flex: none; width: 1.6em; color: #a99fe0; }
    .ranking .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .ranking .score { flex: none; font-weight: bold; font-variant-numeric: tabular-nums; }
    .ranking .where { display: block; font-size: .78rem; font-weight: normal; color: #a99fe0; text-align: right; }

    .ranking .note {
      margin: 0;
      font-size: .9rem;
      color: #d9d2ff;
      text-align: center;
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: .9rem;
      color: #a99fe0;
    }

    @media (prefers-reduced-motion: reduce) {
      .game { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Alan's World</h1>

  <main class="games">
    <div class="game-col">
    <a class="game tower" href="the-tower/">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="94" cy="24" r="12" fill="#ffd93d"/>
        <path d="M34 22h10v8h10v-8h12v8h10v-8h10v22H34z" fill="#f4f1ff"/>
        <rect x="40" y="44" width="40" height="64" fill="#dcd6f7"/>
        <path d="M40 60h40M40 78h40M40 96h40" stroke="#b3a9e6" stroke-width="3"/>
        <rect x="54" y="52" width="12" height="16" rx="6" fill="#1b1447"/>
        <path d="M52 108V92a8 8 0 0 1 16 0v16z" fill="#8a4b2a"/>
        <rect x="24" y="106" width="72" height="8" rx="4" fill="#1b1447" opacity=".35"/>
      </svg>
      <h2>The Tower</h2>
      <span class="play">▶ Play</span>
    </a>
    <section class="ranking" data-board="tower-scores" data-level="story">
      <h3>🏆 Top climbers</h3>
      <p class="note">Loading rankings…</p>
    </section>
    </div>

    <div class="game-col">
    <a class="game alien" href="alien-boom-boom/">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <path d="M44 26 36 10M76 26l8-16" stroke="#1b1447" stroke-width="4" stroke-linecap="round"/>
        <circle cx="36" cy="10" r="5" fill="#ffd93d"/>
        <circle cx="84" cy="10" r="5" fill="#ffd93d"/>
        <path d="M60 20c24 0 38 17 38 38 0 26-20 48-38 48S22 84 22 58c0-21 14-38 38-38z" fill="#c8ff5a" stroke="#1b1447" stroke-width="4"/>
        <ellipse cx="44" cy="58" rx="10" ry="15" fill="#1b1447" transform="rotate(-18 44 58)"/>
        <ellipse cx="76" cy="58" rx="10" ry="15" fill="#1b1447" transform="rotate(18 76 58)"/>
        <circle cx="41" cy="52" r="3" fill="#fff"/>
        <circle cx="73" cy="52" r="3" fill="#fff"/>
        <path d="M48 86q12 9 24 0" fill="none" stroke="#1b1447" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <h2>Alien Boom Boom</h2>
      <span class="play">▶ Play</span>
    </a>
    <section class="ranking" data-board="scores" data-level="level">
      <h3>🏆 Top pilots</h3>
      <p class="note">Loading rankings…</p>
    </section>
    </div>

    <div class="game-col">
    <a class="game junk" href="junkyard/">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <rect x="14" y="86" width="92" height="10" rx="5" fill="#1b1447" opacity=".4"/>
        <path d="M26 54h22v30H26zM78 44h20v40H78z" fill="#3b3550"/>
        <path d="M60 24c17 0 29 14 29 31 0 16-13 29-29 29S31 71 31 55c0-17 12-31 29-31z" fill="#c08ef0" stroke="#1b1447" stroke-width="4"/>
        <ellipse cx="48" cy="54" rx="8" ry="10" fill="#1b1447"/>
        <ellipse cx="72" cy="54" rx="8" ry="10" fill="#1b1447"/>
        <circle cx="45" cy="50" r="3" fill="#fff"/>
        <circle cx="69" cy="50" r="3" fill="#fff"/>
        <path d="M14 30l26 26" stroke="#e8edf5" stroke-width="7" stroke-linecap="round"/>
        <path d="M10 26l8 8" stroke="#ffd93d" stroke-width="9" stroke-linecap="round"/>
      </svg>
      <h2>Junkyard Nights</h2>
      <span class="play">▶ Play</span>
    </a>
    <section class="ranking" data-board="junkyard-scores" data-level="wave">
      <h3>🏆 Top scavengers</h3>
      <p class="note">Loading rankings…</p>
    </section>
    </div>

    <div class="game-col">
    <a class="game ravens" href="ravens/">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="104" rx="34" ry="11" fill="#1b1447"/>
        <ellipse cx="60" cy="103" rx="24" ry="7" fill="#ffd93d"/>
        <path d="M70 30c12 0 20 8 20 18s-9 17-20 17-21-7-21-17 9-18 21-18z" fill="#1b1447"/>
        <path d="M88 44l26-6-24 14z" fill="#1b1447"/>
        <path d="M66 36q-14-22-34-24 14 12 18 30z" fill="#2c2448"/>
        <path d="M66 50q-16 16-38 14 18 6 34 0z" fill="#1b1447"/>
        <path d="M49 38l-11 4 11 5z" fill="#ffd93d"/>
        <circle cx="56" cy="38" r="4" fill="#ff5a5a"/>
        <rect x="55" y="62" width="11" height="30" rx="4" fill="#e8edf5"/>
        <path d="M60 56l-7 10h14z" fill="#ff5a5a"/>
      </svg>
      <h2>Ravens from the Underworld</h2>
      <span class="play">▶ Play</span>
    </a>
    <section class="ranking" data-board="ravens-scores" data-level="wave">
      <h3>🏆 Top shooters</h3>
      <p class="note">Loading rankings…</p>
    </section>
    </div>
  </main>

  <footer>Made by Alan 🚀</footer>

  <script>
    // The games save their rankings in a shared online database; show the top five of each here.
    const RANKINGS_URL = "https://alien-boom-boom-default-rtdb.firebaseio.com";
    const TOP = 5;
    const POOL = 100;   // rows fetched before keeping one per name

    // Keep only each player's best run, so one name can't fill the whole board.
    function bestPerName(rows) {
      const best = new Map();
      for (const row of rows) {
        const key = String(row.name || "?").trim().replace(/\s+/g, " ").toLowerCase();
        const kept = best.get(key);
        const better = !kept || row.score > kept.score ||
          (row.score === kept.score && (row.level || 0) > (kept.level || 0));
        if (better) best.set(key, row);
      }
      return [...best.values()];
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = text;   // names are typed by players, so never treat them as HTML
      return node;
    }

    async function showRanking(section) {
      const note = section.querySelector(".note");
      try {
        const reply = await fetch(`${RANKINGS_URL}/${section.dataset.board}.json?orderBy=%22score%22&limitToLast=${POOL}`);
        if (!reply.ok) throw new Error(reply.status);
        const rows = bestPerName(Object.values(await reply.json() || {})
            .filter(row => row && Number.isFinite(row.score)))
          .sort((a, b) => b.score - a.score)
          .slice(0, TOP);
        if (!rows.length) {
          note.textContent = "No scores yet. Be the first!";
          return;
        }
        const list = document.createElement("ol");
        rows.forEach((row, i) => {
          const item = document.createElement("li");
          const score = el("span", "score", row.score.toLocaleString());
          score.append(el("span", "where", `${section.dataset.level} ${row.level}`));
          item.append(el("span", "place", `${i + 1}.`), el("span", "name", String(row.name || "?")), score);
          list.append(item);
        });
        note.replaceWith(list);
      } catch (err) {
        note.textContent = "Rankings can't be loaded right now.";
      }
    }

    document.querySelectorAll(".ranking").forEach(showRanking);
  </script>
</body>
</html>
