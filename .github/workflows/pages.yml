name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web versions of the games with pygbag
        run: |
          pip install pygbag==0.9.3
          python -m pygbag --build --ume_block 0 --title "Alien Boom Boom" alien-boom-boom
          # pygbag needs the game in main.py, in a folder named after the game
          mkdir -p /tmp/web/the-tower
          cp the-tower/tower.py /tmp/web/the-tower/main.py
          cp the-tower/favicon.png /tmp/web/the-tower/
          python -m pygbag --build --title "The Tower" /tmp/web/the-tower
          mkdir -p /tmp/web/junkyard
          cp junkyard/junkyard.py /tmp/web/junkyard/main.py
          python -m pygbag --build --title "Junkyard Nights" /tmp/web/junkyard
          mkdir -p /tmp/web/ravens
          cp ravens/ravens.py /tmp/web/ravens/main.py
          python -m pygbag --build --title "Ravens from the Underworld" /tmp/web/ravens
          mkdir -p /tmp/web/tree-jumper
          cp tree-jumper/tree_jumper.py /tmp/web/tree-jumper/main.py
          python -m pygbag --build --title "Tree Jumper" /tmp/web/tree-jumper
          mkdir -p /tmp/web/track-of-doom
          cp track-of-doom/track_of_doom.py /tmp/web/track-of-doom/main.py
          python -m pygbag --build --title "Track of Doom" /tmp/web/track-of-doom
      - name: Put the home page and the games together
        run: |
          mkdir _site
          cp index.html CNAME .nojekyll _site/
          cp -r alien-boom-boom/build/web _site/alien-boom-boom
          cp -r /tmp/web/the-tower/build/web _site/the-tower
          cp -r /tmp/web/junkyard/build/web _site/junkyard
          cp -r /tmp/web/ravens/build/web _site/ravens
          cp -r /tmp/web/tree-jumper/build/web _site/tree-jumper
          cp -r /tmp/web/track-of-doom/build/web _site/track-of-doom
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
