name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web versions of the games with pygbag
        run: |
          pip install pygbag==0.9.3
          python -m pygbag --build --ume_block 0 --title "Alien Boom Boom" alien-boom-boom
          # pygbag needs the game in main.py, in a folder named after the game
          mkdir -p /tmp/web/the-tower
          cp the-tower/tower.py /tmp/web/the-tower/main.py
          cp the-tower/favicon.png /tmp/web/the-tower/
          python -m pygbag --build --title "The Tower" /tmp/web/the-tower
      - name: Put the home page and the games together
        run: |
          mkdir _site
          cp index.html CNAME .nojekyll _site/
          cp -r alien-boom-boom/build/web _site/alien-boom-boom
          cp -r /tmp/web/the-tower/build/web _site/the-tower
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
